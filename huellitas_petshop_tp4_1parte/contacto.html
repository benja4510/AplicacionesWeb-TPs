<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas - Contacto</title>
    <link rel="stylesheet" href="./recursos/css/estilos.css">
    <script type="module" src="./recursos/js/main.js"></script>
</head>
<body class="pagina-huellitas" data-pagina="contacto">
    <header class="header-principal">
        <a class="header-principal__logo" href="./index.html" aria-label="Ir a Inicio">
            <img src="./recursos/imagenes/huella.png" alt="logo tienda" width="60" height="60">
        </a>

        <nav class="menu-principal" aria-label="Navegación principal">
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./catalogo.html">Catalogo</a></li>
                <li><a href="./servicios.html">Servicios</a></li>
                <li><a href="./carrito.html">Carrito <span class="menu-principal__contador" data-contador-carrito hidden>0</span></a></li>
                <li><a href="./contacto.html" aria-current="page">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido-principal">
        <h1>Contacto</h1>

        <section>
            <h2>Escribinos tu consulta</h2>
            <form class="formulario" id="form-contacto" action="./contacto.html" method="post" novalidate>
                <fieldset>
                    <legend>Formulario de Consulta</legend>

                    <div class="formulario__campo">
                        <label for="id-nombre">Nombre:</label>
                        <input type="text" name="nombre" id="id-nombre" required aria-describedby="error-id-nombre">
                        <p class="formulario__error" id="error-id-nombre"></p>
                    </div>

                    <div class="formulario__campo">
                        <label for="id-telefono">Teléfono:</label>
                        <input type="tel" name="telefono" id="id-telefono" aria-describedby="error-id-telefono">
                        <p class="formulario__error" id="error-id-telefono"></p>
                    </div>

                    <div class="formulario__campo">
                        <label for="id-tamaño-mascota">Tamaño de mascota:</label>
                        <select name="tamaño-mascota" id="id-tamaño-mascota">
                            <option value="C">Chico</option>
                            <option value="M">Mediano</option>
                            <option value="G">Grande</option>
                        </select>
                    </div>

                    <div class="formulario__campo">
                        <label for="id-edad">Edad:</label>
                        <input type="number" name="edad" id="id-edad" aria-describedby="error-id-edad">
                        <p class="formulario__error" id="error-id-edad"></p>
                    </div>

                    <div class="formulario__campo">
                        <label for="id-comentario">Comentario sobre la mascota:</label>
                        <textarea name="comentario" id="id-comentario" rows="4" aria-describedby="error-id-comentario"></textarea>
                        <p class="formulario__error" id="error-id-comentario"></p>
                    </div>
                </fieldset>

                <p class="alerta alerta--exito" id="contacto-aviso" role="status" hidden></p>

                <div class="formulario__acciones">
                    <button class="boton boton--secundario" type="reset">Limpiar</button>
                    <button class="boton boton--primario" type="submit">Enviar Consulta</button>
                </div>
            </form>
        </section>

        <section class="mapa-ubicacion">
            <h2>Dónde Estamos</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.5849554458846!2d-64.18168492325253!3d-31.425559396696883!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a29115cfcf0f%3A0xe548e61630db3a2c!2sSan%20Lorenzo%20600%2C%20X5000%20AZL%2C%20C%C3%B3rdoba!5e0!3m2!1ses!2sar!4v1789580905050!5m2!1ses!2sar"
                width="600"
                height="450"
                style="border:0;"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                title="Ubicación Google Maps de Huellitas en San Lorenzo 600">
            </iframe>
        </section>
    </main>

    <footer class="footer-principal">
        <ul>
            <li>
                <a href="https://instagram.com/@Huellitas" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Huellitas">
                    @Huellitas
                </a>
            </li>
            <li>
                San Lorenzo 600 - Bº Nueva Cordoba
            </li>
        </ul>
    </footer>
</body>
</html>
