<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas - Contacto</title>
</head>

<body>
    <header>
        <a href="./index.html" aria-label="Ir al Inicio">
            <img src="./recursos/imagenes/huella.png" alt="logo Huellitas" width="60" height="60">
        </a>
        <nav aria-label="Navegación principal">
            <ul>
                <li>
                    <a href="./index.html">Inicio</a>
                </li>
                <li>
                    <a href="./catalogo.html">Catalogo</a>
                </li>
                <li>
                    <a href="./contacto.html" aria-current="page">Contacto</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contacto</h1>
        <h2>Escribinos</h2>
        <form action="./contacto.html" method="post">
            <p>
                <label for="id-nombre">Nombre</label>
                <input type="text" name="nombre" id="id-nombre">
            </p>

            <p>
                <label for="id-telefono">telefono</label>
                <input type="tel" name="telefono" id="id-telefono">
            </p>

            <p>
                <label for="id-tamaño-mascota">tamaño de mascota</label>
                <select name="tamaño-mascota" id="id-tamaño-mascota">
                    <option value="C">Chico</option>
                    <option value="M">Mediano</option>
                    <option value="G">Grande</option>
                </select>
            </p>

            <p>
                <label for="id-edad">edad</label>
                <input type="number" name="edad" id="id-edad">
            </p>

            <p>
                <label for="id-comentario">comentario sobre la mascota</label>
                <textarea name="comentario" id="id-comentario"></textarea>
            </p>

            <p>
                <button type="reset">Limpiar</button>
                <button type="submit">Enviar</button>
            </p>
        </form>

        <h2>Donde Estamos</h2>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.5849554458846!2d-64.18168492325253!3d-31.425559396696883!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a29115cfcf0f%3A0xe548e61630db3a2c!2sSan%20Lorenzo%20600%2C%20X5000%20AZL%2C%20C%C3%B3rdoba!5e0!3m2!1ses!2sar!4v1789580905050!5m2!1ses!2sar" 
            width="600" 
            height="450" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="strict-origin-when-cross-origin"
            title="Ubicación Google Maps de Huellitas en San Lorenzo 600">
        </iframe>
    </main>

    <footer>
        <ul>
            <li>
                <a href="https://instagram.com/@Huellitas" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Huellitas">
                    @Huellitas
                </a>
            </li>
            <li>
                San Lorenzo 600 - Bº Nueva Cordoba 
            </li>
        </ul>
    </footer>
</body>
</html>
